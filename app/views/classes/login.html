<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador</title>
    
    <!-- Bootstrap 5 via CDN (garante que os estilos sempre carreguem) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-card {
            max-width: 400px;
            width: 90%;
            padding: 2.5rem;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .btn-primary {
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">Seja Bem-Vindo!</h2>
            <p class="text-muted small">Digite suas credenciais para continuar</p>
        </div>

        <form action="../../controllers/admin-login.php" method="POST">
            <div class="mb-3">
                <label for="nome" class="form-label fw-semibold text-secondary">Nome de Usuário</label>
                <input type="text" class="form-control" name="nome" id="nome" placeholder="Seu usuário" required autofocus>
            </div>
            
            <div class="mb-4">
                <label for="senha" class="form-label fw-semibold text-secondary">Senha</label>
                <input type="password" class="form-control" name="senha" id="senha" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Entrar no Sistema</button>
        </form>
    </div>

</body>
</html>
